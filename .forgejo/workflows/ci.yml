# Forgejo host-runner checks only. No publishing or deployment.
# .forgejo/workflows takes precedence over imported GitHub workflows.
name: Forgejo CI
'on':
  push:
    branches:
    - main
    - master
    - ci/forgejo-verification-20261023
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: forgejo-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {}
    steps:
    - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Run project verification
      shell: bash
      run: 'set -euo pipefail

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 composer
        validate --strict --no-check-publish

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 composer
        install --no-interaction --no-scripts --no-plugins --prefer-dist --no-dev

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 composer
        check-platform-reqs

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 composer
        audit --locked --no-dev

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 php -d
        memory_limit=512M tests/commonmark-security.php'
