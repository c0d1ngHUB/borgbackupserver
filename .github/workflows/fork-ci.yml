# Self-hosted Runner auf dem Desktop (aiex-desktop-*), nur Prüfungen; kein Veröffentlichen, kein Deployment.
name: CI
'on':
  push:
    branches:
    - main
    - master
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    runs-on: [self-hosted, desktop]
    timeout-minutes: 40
    env: {}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Run project verification
      shell: bash
      run: 'set -euo pipefail

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 composer
        validate --strict --no-check-publish

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 composer
        install --no-interaction --no-scripts --no-plugins --prefer-dist --no-dev

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 composer
        check-platform-reqs

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 composer
        audit --locked --no-dev

        docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" -w /app composer:2 php -d
        memory_limit=512M tests/commonmark-security.php'
